<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Leagues Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }

    #dashboard-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Left Sidebar Tree */
    #sidebar {
      width: 340px;
      background: #ffffff;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Center Map Container */
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    /* Right Explorer Panel */
    #explorer-panel {
      width: 380px;
      background: #ffffff;
      height: 100%;
      box-shadow: -4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      overflow-y: auto;
      flex-shrink: 0;
    }

    @media (max-width: 1100px) {
      #dashboard-wrapper { flex-direction: column; }
      
      /* Map takes 38% height on mobile */
      #map-container { 
        height: 38vh !important; 
        order: 1; 
        width: 100%;
      }

      /* Panels take remaining bottom space stacked without tabs */
      #sidebar {
        width: 100% !important;
        height: 62vh !important;
        order: 2;
        display: flex !important;
      }

      #explorer-panel {
        width: 100% !important;
        height: 62vh !important;
        order: 2;
        display: none !important;
      }

      #explorer-panel.mobile-active {
        display: flex !important;
      }
      #sidebar.mobile-hidden {
        display: none !important;
      }
    }

    .sidebar-header, .panel-header {
      display: none !important;
    }

    /* Prominent Navigation Bars matching heading style */
    .nav-bar-banner {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .filter-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      flex: 1;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-action:hover { background: #f1f5f9; color: #0f172a; }
    .btn-action.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
      font-weight: 700;
      box-shadow: 0 0 0 1.5px rgba(2, 132, 199, 0.4);
    }

    /* Fixed scrolling container for sidebar tree */
    .sidebar-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-heading {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0 2px 4px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    /* League Accordion Card */
    .conf-group {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .conf-summary {
      padding: 8px 10px;
      font-weight: 700;
      font-size: 11px;
      color: #0f172a;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }
    .conf-summary:hover { background: #f1f5f9; }

    .conf-info-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .conf-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .conf-toggle-arrow {
      color: #64748b;
      font-size: 9px;
    }

    .school-list {
      padding: 4px 10px 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #f1f5f9;
      background: #ffffff;
      max-height: 240px;
      overflow-y: auto;
    }

    .school-item {
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
    }
    .school-name:hover { color: #0284c7; text-decoration: underline; }
    .school-item.selected-active .school-name { color: #0284c7; font-weight: 800; }

    .panel-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .venue-photo-container {
      width: 100%;
      height: 130px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .venue-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 12px;
    }

    .team-title { font-size: 15px; font-weight: 800; color: #0f172a; margin: 0; }
    .team-subtitle { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-top: 1px; }

    .conf-badge-large {
      display: inline-block;
      font-weight: 800;
      font-size: 9px;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
    }

    .info-label { font-size: 8px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .info-value { font-size: 11px; font-weight: 700; color: #0f172a; margin-top: 1px; }

    .notes-box {
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10px;
      color: #92400e;
      line-height: 1.3;
    }

    .wiki-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      transition: background 0.15s ease;
    }
    .wiki-btn:hover { background: #0369a1; }

    .back-conf-btn {
      background: #334155;
      color: #ffffff;
      border: 1.5px solid #475569;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      flex: 1;
      box-sizing: border-box;
    }
    .back-conf-btn:hover { background: #475569; color: #ffffff; }

    .venue-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #cbd5e1; border-radius: 4px; color: #0f172a; font-size: 11px; font-weight: 600; padding: 3px 7px; }
  </style>
</head>
<body>

  <div id="dashboard-wrapper">
    <!-- Left Sidebar: Pro Leagues -->
    <div id="sidebar">
      <div class="nav-bar-banner">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>Pro Leagues</span>
          <span id="active-count" style="font-size: 11px; font-weight: 600; opacity: 0.9;">Loading...</span>
        </div>
        <div style="display: flex; gap: 4px; width: 100%;">
          <button class="btn-action active" id="btn-select-all" style="background:#334155; border-color:#475569; color:#fff;">All</button>
          <button class="btn-action" id="btn-big-4" style="background:#334155; border-color:#475569; color:#fff;">Big 4</button>
          <button class="btn-action" id="btn-select-none" style="background:#334155; border-color:#475569; color:#fff;">None</button>
        </div>
      </div>
      <div class="sidebar-content" id="sidebar-tree"></div>
    </div>

    <!-- Center Map -->
    <div id="map-container">
      <div id="map"></div>
    </div>

    <!-- Right Explorer Panel: Team & Venue Details -->
    <div id="explorer-panel">
      <div class="nav-bar-banner">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>Team & Venue Details</span>
        </div>
        <div style="display: flex; gap: 4px; width: 100%;">
          <button class="back-conf-btn" id="back-to-conf-btn">&larr; Back to Leagues</button>
          <button class="back-conf-btn" id="prev-venue-btn">Previous</button>
          <button class="back-conf-btn" id="next-venue-btn">Next</button>
        </div>
      </div>
      <div class="panel-body" id="panel-content">
        <div class="venue-photo-container">
          <div class="photo-placeholder">Click any stadium marker on the map or team name in the sidebar to inspect details and Wikipedia photos.</div>
        </div>
        <div>
          <h2 class="team-title">Select a Team</h2>
          <div class="team-subtitle">Interactive Dashboard</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1XHaT57dHhRLtMojDEXhMn8AMScxz5F7WBe1i8y6NIe4";
    const SHEET_NAME = "Pro";

    const LEAGUE_COLORS = {
      "NFL": "#0284c7",   /* Blue */
      "MLB": "#dc2626",   /* Red */
      "NBA": "#ea580c",   /* Orange */
      "NHL": "#4f46e5",   /* Indigo */
      "MLS": "#16a34a",   /* Green */
      "NWSL": "#db2777",  /* Pink */
      "WNBA": "#9333ea"   /* Purple */
    };

    const BIG_4 = new Set(["NFL", "MLB", "NBA", "NHL"]);
    const ALL_LEAGUES_ORDER = ["NFL", "MLB", "NBA", "NHL", "MLS", "NWSL", "WNBA"];

    const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true });
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true });

    const initialZoom = window.innerWidth <= 1100 ? 3 : 4;
    const map = L.map('map', { zoomControl: true, minZoom: 3, layers: [osmStandard] }).setView([39.8283, -98.5795], initialZoom);
    let activeBasemapLayer = osmStandard;
    const venueLayer = L.layerGroup().addTo(map);

    let venues = [];
    let currentFilteredVenues = [];
    let currentVenueIndex = -1;
    let markersMap = {}; 
    let activeFilterKey = null; // Can be league name or "metro:MetroName"
    let selectedTeamName = null; // Tracks single selected team for permanent tooltip

    function getNationalZoom() {
      return window.innerWidth <= 1100 ? 3 : 4;
    }

    function updateBasemapForZoom() {
      const currentZoom = map.getZoom();
      let targetLayer = currentZoom <= 6 ? osmStandard : esriSatellite;
      if (activeBasemapLayer !== targetLayer) {
        if (map.hasLayer(activeBasemapLayer)) map.removeLayer(activeBasemapLayer);
        map.addLayer(targetLayer);
        activeBasemapLayer = targetLayer;
      }
    }

    function showMobilePanel(panelType) {
      const sidebar = document.getElementById('sidebar');
      const explorer = document.getElementById('explorer-panel');
      if (panelType === 'explorer') {
        explorer.classList.add('mobile-active');
        sidebar.classList.add('mobile-hidden');
      } else {
        explorer.classList.remove('mobile-active');
        sidebar.classList.remove('mobile-hidden');
      }
      setTimeout(() => { map.invalidateSize(); }, 100);
    }

    function resetRightPanel() {
      currentVenueIndex = -1;
      selectedTeamName = null;
      updateMapFilters();
      const panelContent = document.getElementById('panel-content');
      panelContent.innerHTML = `
        <div class="venue-photo-container">
          <div class="photo-placeholder">Click any stadium marker on the map or team name in the sidebar to inspect details and Wikipedia photos.</div>
        </div>
        <div>
          <h2 class="team-title">Select a Team</h2>
          <div class="team-subtitle">Interactive Dashboard</div>
        </div>
      `;
      document.querySelectorAll('.school-item').forEach(el => el.classList.remove('selected-active'));
      if (window.innerWidth <= 1100) {
        showMobilePanel('sidebar');
      }
    }

    async function fetchWikiImage(wikiUrl, venueName) {
      let titles = [];
      if (wikiUrl && wikiUrl.includes('/wiki/')) {
        let slug = wikiUrl.split('/wiki/')[1].split('#')[0].split('?')[0];
        titles.push(slug);
      }
      titles.push(encodeURIComponent(venueName));

      for (let t of titles) {
        const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=600&redirects=1&titles=${t}&origin=*`;
        try {
          const response = await fetch(apiUrl);
          const data = await response.json();
          if (data.query && data.query.pages) {
            const pages = data.query.pages;
            for (let id in pages) {
              if (pages[id].thumbnail && pages[id].thumbnail.source) {
                return pages[id].thumbnail.source;
              }
            }
          }
        } catch (e) {
          console.log("Wiki fetch error for title:", t);
        }
      }
      return null;
    }

    async function showVenueDetails(v, index = -1) {
      if (index !== -1) {
        currentVenueIndex = index;
      } else {
        currentVenueIndex = currentFilteredVenues.findIndex(item => item.team === v.team);
      }

      selectedTeamName = v.team;
      updateMapFilters();

      const color = LEAGUE_COLORS[v.league] || "#475569";
      const capacityStr = v.capacity ? Number(v.capacity).toLocaleString() : 'N/A';
      const wikiUrl = v.wikiUrl && v.wikiUrl.startsWith('http') ? v.wikiUrl : `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(v.venue + ' ' + v.team)}`;

      const panelContent = document.getElementById('panel-content');
      panelContent.innerHTML = `
        <div class="venue-photo-container" id="photo-box">
          <div class="photo-placeholder">Loading Wikipedia photo...</div>
        </div>
        <div>
          <span class="conf-badge-large" style="background:${color};">${v.league}</span>
          <h2 class="team-title">${v.team}</h2>
          <div class="team-subtitle">${v.venueCity}</div>
        </div>
        <div class="info-grid">
          <div class="info-card">
            <div class="info-label">Venue Name</div>
            <div class="info-value" style="font-size: 11px; margin-top:2px;">${v.venue}</div>
          </div>
          <div class="info-card">
            <div class="info-label">Capacity</div>
            <div class="info-value">${capacityStr}</div>
          </div>
        </div>
        <a href="${wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-btn">View on Wikipedia &rarr;</a>
        ${v.notes ? `<div class="notes-box"><b>Notes:</b> ${v.notes}</div>` : ''}
      `;

      if (window.innerWidth <= 1100) {
        showMobilePanel('explorer');
      }

      document.querySelectorAll('.school-item').forEach(el => el.classList.remove('selected-active'));
      const activeEl = document.getElementById(`school-item-${v.team.replace(/\s+/g, '_')}`);
      if (activeEl) {
        activeEl.classList.add('selected-active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const imgUrl = await fetchWikiImage(v.wikiUrl, v.venue);
      const photoBox = document.getElementById('photo-box');
      if (photoBox) {
        if (imgUrl) {
          photoBox.innerHTML = `<img src="${imgUrl}" alt="${v.venue}">`;
        } else {
          photoBox.innerHTML = `<div class="photo-placeholder">No Wikipedia photo available</div>`;
        }
      }
    }

    function renderSidebarTree(leagueGrouped, metroGrouped) {
      const container = document.getElementById('sidebar-tree');
      container.innerHTML = '';

      // Single Leagues Section in specified order
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.textContent = "Leagues";
      container.appendChild(heading);

      ALL_LEAGUES_ORDER.forEach(league => {
        if (!leagueGrouped[league]) return;
        const teams = leagueGrouped[league].sort((a, b) => a.team.localeCompare(b.team));
        const color = LEAGUE_COLORS[league] || "#475569";

        const groupDiv = document.createElement('div');
        groupDiv.className = 'conf-group';

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'conf-summary';
        summaryDiv.innerHTML = `
          <div class="conf-info-left">
            <span class="conf-swatch" style="background:${color};"></span>
            <span><b>${league}</b> (${teams.length})</span>
          </div>
          <span class="conf-toggle-arrow">▼</span>
        `;

        const listDiv = document.createElement('div');
        listDiv.className = 'school-list';
        listDiv.style.display = 'none';

        summaryDiv.addEventListener('click', () => {
          const isHidden = listDiv.style.display === 'none';

          document.querySelectorAll('.school-list').forEach(el => el.style.display = 'none');
          document.querySelectorAll('.conf-toggle-arrow').forEach(el => el.textContent = '▼');

          if (isHidden) {
            listDiv.style.display = 'flex';
            summaryDiv.querySelector('.conf-toggle-arrow').textContent = '▲';
            activeFilterKey = league;
          } else {
            activeFilterKey = null;
          }

          selectedTeamName = null;

          ['btn-select-all', 'btn-big-4', 'btn-select-none'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) btn.style.background = '#334155';
          });

          updateMapFilters();
          map.setView([39.8283, -98.5795], getNationalZoom());
          resetRightPanel();
        });

        teams.forEach(v => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'school-item';
          itemDiv.id = `school-item-${v.team.replace(/\s+/g, '_')}`;
          itemDiv.innerHTML = `<span class="school-name">${v.team}</span>`;

          itemDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            const globalIdx = currentFilteredVenues.findIndex(item => item.team === v.team);
            map.flyTo(v.coords, 15, { duration: 0.8 });
            showVenueDetails(v, globalIdx);
          });

          listDiv.appendChild(itemDiv);
        });

        groupDiv.appendChild(summaryDiv);
        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      });

      // Metro Areas Section
      const metroHeading = document.createElement('div');
      metroHeading.className = 'section-heading';
      metroHeading.textContent = "Metro Areas";
      container.appendChild(metroHeading);

      // Sort metros by total number of teams descending, then alphabetically by name
      const sortedMetros = Object.keys(metroGrouped).sort((a, b) => {
        const countDiff = metroGrouped[b].length - metroGrouped[a].length;
        if (countDiff !== 0) return countDiff;
        return a.localeCompare(b);
      });

      sortedMetros.forEach(metro => {
        const teams = metroGrouped[metro].sort((a, b) => a.team.localeCompare(b.team));
        const groupDiv = document.createElement('div');
        groupDiv.className = 'conf-group';

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'conf-summary';
        summaryDiv.innerHTML = `
          <div class="conf-info-left">
            <span class="conf-swatch" style="background:#64748b;"></span>
            <span><b>${metro}</b> (${teams.length})</span>
          </div>
          <span class="conf-toggle-arrow">▼</span>
        `;

        const listDiv = document.createElement('div');
        listDiv.className = 'school-list';
        listDiv.style.display = 'none';

        summaryDiv.addEventListener('click', () => {
          const isHidden = listDiv.style.display === 'none';

          document.querySelectorAll('.school-list').forEach(el => el.style.display = 'none');
          document.querySelectorAll('.conf-toggle-arrow').forEach(el => el.textContent = '▼');

          selectedTeamName = null;

          if (isHidden) {
            listDiv.style.display = 'flex';
            summaryDiv.querySelector('.conf-toggle-arrow').textContent = '▲';
            activeFilterKey = "metro:" + metro;

            // Compute bounding box or center for metro teams to zoom in
            let lats = teams.map(t => t.coords[0]);
            let lngs = teams.map(t => t.coords[1]);
            let minLat = Math.min(...lats), maxLat = Math.max(...lats);
            let minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
            let centerLat = (minLat + maxLat) / 2;
            let centerLng = (minLng + maxLng) / 2;

            if (teams.length === 1) {
              map.flyTo([centerLat, centerLng], 13, { duration: 0.8 });
            } else {
              map.fitBounds([[minLat, minLng], [maxLat, maxLng]], { padding: [50, 50], maxZoom: 12, duration: 0.8 });
            }
          } else {
            activeFilterKey = null;
            map.setView([39.8283, -98.5795], getNationalZoom());
          }

          ['btn-select-all', 'btn-big-4', 'btn-select-none'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) btn.style.background = '#334155';
          });

          updateMapFilters();
          resetRightPanel();
        });

        teams.forEach(v => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'school-item';
          itemDiv.id = `school-item-${v.team.replace(/\s+/g, '_')}`;
          itemDiv.innerHTML = `<span class="school-name">${v.team}</span>`;

          itemDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            const globalIdx = currentFilteredVenues.findIndex(item => item.team === v.team);
            map.flyTo(v.coords, 15, { duration: 0.8 });
            showVenueDetails(v, globalIdx);
          });

          listDiv.appendChild(itemDiv);
        });

        groupDiv.appendChild(summaryDiv);
        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      });

      updateMapFilters();
    }

    function updateMapFilters() {
      venueLayer.clearLayers();
      markersMap = {};
      currentFilteredVenues = [];

      venues.forEach(v => {
        let show = false;
        if (activeFilterKey) {
          if (activeFilterKey.startsWith("metro:")) {
            const targetMetro = activeFilterKey.substring(6);
            show = (v.metro === targetMetro);
          } else {
            show = (v.league === activeFilterKey);
          }
        } else {
          const btnAll = document.getElementById('btn-select-all');
          const btnBig4 = document.getElementById('btn-big-4');
          const btnNone = document.getElementById('btn-select-none');

          if (btnAll.classList.contains('active')) show = true;
          else if (btnBig4.classList.contains('active')) show = BIG_4.has(v.league);
          else if (btnNone.classList.contains('active')) show = false;
          else show = true;
        }

        if (show) {
          currentFilteredVenues.push(v);
        }
      });

      currentFilteredVenues.forEach(v => {
        const color = LEAGUE_COLORS[v.league] || "#475569";
        const marker = L.circleMarker(v.coords, {
          radius: 6.5, fillColor: color, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.95
        }).addTo(venueLayer);

        marker.on('click', () => {
          const globalIdx = currentFilteredVenues.findIndex(item => item.team === v.team);
          map.flyTo(v.coords, 15, { duration: 0.8 });
          showVenueDetails(v, globalIdx);
        });

        // Permanent label ONLY for the explicitly selected/inspected team; hover tooltips for all others
        const isSelected = (selectedTeamName === v.team);

        marker.bindTooltip(`<b>${v.team}</b>`, {
          permanent: isSelected,
          direction: 'top',
          className: 'venue-tooltip',
          offset: [0, -8]
        });
        markersMap[v.team] = marker;
      });

      document.getElementById('active-count').textContent = `${currentFilteredVenues.length} of ${venues.length} teams shown`;
      updateBasemapForZoom();
    }

    function setActiveFilterButton(btnId) {
      ['btn-select-all', 'btn-big-4', 'btn-select-none'].forEach(id => {
        const btn = document.getElementById(id);
        btn.classList.remove('active');
        btn.style.background = '#334155';
        btn.style.borderColor = '#475569';
      });
      const activeBtn = document.getElementById(btnId);
      activeBtn.classList.add('active');
      activeBtn.style.background = '#0284c7';
      activeBtn.style.borderColor = '#0369a1';

      activeFilterKey = null;
      selectedTeamName = null;
      document.querySelectorAll('.school-list').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.conf-toggle-arrow').forEach(el => el.textContent = '▼');
      map.setView([39.8283, -98.5795], getNationalZoom());
      resetRightPanel();
    }

    window.handleGvizResponse = function(response) {
      if (!response || !response.table) return;
      const cols = response.table.cols.map((c, idx) => (c && c.label) ? c.label.trim() : String.fromCharCode(65 + idx));
      const rawRows = response.table.rows.map(r => {
        let rowObj = {};
        if (r && r.c) {
          r.c.forEach((cell, idx) => {
            rowObj[cols[idx] || String.fromCharCode(65 + idx)] = (cell && cell.v !== null) ? cell.v : '';
          });
        }
        return rowObj;
      });

      function getRowVal(row, possibleKeys) {
        for (let key of possibleKeys) {
          for (let rk in row) {
            if (rk.trim().toLowerCase() === key.toLowerCase()) return row[rk];
          }
        }
        return '';
      }

      venues = [];
      const leagueGrouped = {};
      const metroGrouped = {};

      rawRows.forEach(row => {
        const league = String(getRowVal(row, ['League']) || '').trim();
        const metro = String(getRowVal(row, ['Metro Area', 'Metro']) || 'Other').trim();
        const team = String(getRowVal(row, ['Team', 'Team Name', 'Franchise', 'Club']) || '').trim();
        const venueName = String(getRowVal(row, ['Venue Name', 'Stadium', 'Venue']) || '').trim();
        const venueCity = String(getRowVal(row, ['City', 'Venue City']) || '').trim();
        const capacity = getRowVal(row, ['Capacity', 'Seating Capacity', 'Venue Capacity']);
        const notes = String(getRowVal(row, ['Notes', 'Notes (as needed)']) || '').trim();
        const lat = parseFloat(getRowVal(row, ['Latitude', 'Lat']));
        const lng = parseFloat(getRowVal(row, ['Longitude', 'Lng']));
        const wikiUrl = String(getRowVal(row, ['Venue Wiki', 'Wiki', 'Wikipedia']) || '').trim();

        if (!league || !venueName || isNaN(lat) || isNaN(lng) || !team) return;
        const vObj = { league, metro, team, venue: venueName, venueCity, capacity, notes, coords: [lat, lng], wikiUrl };
        venues.push(vObj);

        if (!leagueGrouped[league]) leagueGrouped[league] = [];
        leagueGrouped[league].push(vObj);

        if (!metroGrouped[metro]) metroGrouped[metro] = [];
        metroGrouped[metro].push(vObj);
      });

      renderSidebarTree(leagueGrouped, metroGrouped);
    };

    /* Top Filter Buttons */
    document.getElementById('btn-select-all').addEventListener('click', () => {
      setActiveFilterButton('btn-select-all');
      updateMapFilters();
    });
    document.getElementById('btn-big-4').addEventListener('click', () => {
      setActiveFilterButton('btn-big-4');
      updateMapFilters();
    });
    document.getElementById('btn-select-none').addEventListener('click', () => {
      setActiveFilterButton('btn-select-none');
      updateMapFilters();
    });

    /* Initialize initial active button state color */
    const initialActiveBtn = document.getElementById('btn-select-all');
    initialActiveBtn.style.background = '#0284c7';
    initialActiveBtn.style.borderColor = '#0369a1';

    /* Navigation Listeners */
    document.getElementById('back-to-conf-btn').addEventListener('click', () => {
      map.setView([39.8283, -98.5795], getNationalZoom());
      resetRightPanel();
    });

    document.getElementById('prev-venue-btn').addEventListener('click', () => {
      if (currentFilteredVenues.length === 0) return;
      if (currentVenueIndex === -1) {
        currentVenueIndex = currentFilteredVenues.length - 1;
      } else {
        currentVenueIndex = (currentVenueIndex - 1 + currentFilteredVenues.length) % currentFilteredVenues.length;
      }
      const v = currentFilteredVenues[currentVenueIndex];
      map.flyTo(v.coords, 15, { duration: 0.8 });
      showVenueDetails(v, currentVenueIndex);
    });

    document.getElementById('next-venue-btn').addEventListener('click', () => {
      if (currentFilteredVenues.length === 0) return;
      if (currentVenueIndex === -1) {
        currentVenueIndex = 0;
      } else {
        currentVenueIndex = (currentVenueIndex + 1) % currentFilteredVenues.length;
      }
      const v = currentFilteredVenues[currentVenueIndex];
      map.flyTo(v.coords, 15, { duration: 0.8 });
      showVenueDetails(v, currentVenueIndex);
    });

    const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=responseHandler:handleGvizResponse`;
    const script = document.createElement('script');
    script.src = gvizUrl;
    document.body.appendChild(script);

    map.on('zoomend', updateBasemapForZoom);
  </script>
</body>
</html>
